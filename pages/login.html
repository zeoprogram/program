<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Garage Booking</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <h1>Garage Booking</h1>

            <p>Masuk ke akun Anda</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Masuk
                </button>

            </form>

        </div>

    </main>

    <script src="../script.js"></script>

</body>
</html>
